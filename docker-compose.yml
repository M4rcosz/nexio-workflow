services:
  mongo:
    image: mongo:8
    ports:
      # publicado so no loopback: "27017:27017" abriria o banco em todas as interfaces da maquina
      - "127.0.0.1:27017:27017"
    environment:
      # ATENCAO: credencial de desenvolvimento local, versionada de proposito e valida apenas para
      # este compose ligado ao loopback. Nao promover para nenhum ambiente compartilhado ou
      # acessivel pela rede -- la a credencial vem de segredo, fora do repositorio.
      MONGO_INITDB_ROOT_USERNAME: nexio
      MONGO_INITDB_ROOT_PASSWORD: nexio
      MONGO_INITDB_DATABASE: nexio_workflow
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo_data:

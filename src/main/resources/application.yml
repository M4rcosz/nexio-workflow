spring:
  application:
    name: nexio-workflow

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://nexio:nexio@localhost:27017/nexio_workflow?authSource=admin}
      # desde o Spring Data 3.0 o padrao e false: sem isto as anotacoes @CompoundIndex nao criam indice
      auto-index-creation: true

  graphql:
    graphiql:
      enabled: ${GRAPHIQL_ENABLED:true}
    path: /graphql
    schema:
      locations: classpath:graphql/**/

nexio:
  http:
    # requisicoes de saida dos nos de workflow so podem usar https; http em texto claro fica
    # restrito a dev/teste, onde o alvo e um servico local
    allow-insecure-http: ${NEXIO_HTTP_ALLOW_INSECURE:false}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

---
spring:
  config:
    activate:
      on-profile: test
  data:
    mongodb:
      # sobrescrito pelo Testcontainers via @DynamicPropertySource
      uri: mongodb://localhost:27017/nexio_workflow_test

nexio:
  http:
    allow-insecure-http: true

spring:
  application:
    name: nexio-workflow

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://nexio:nexio@localhost:27017/nexio_workflow?authSource=admin}
      # Desligado fora de dev/teste de proposito: a criacao automatica roda na subida do contexto,
      # o que faz a aplicacao precisar de Mongo acessivel e de privilegio de indice so para bootar,
      # segura a subida enquanto o indice e construido numa colecao populada e, pior, derruba toda
      # instancia no meio de um rollout com IndexOptionsConflict se alguma definicao de
      # @CompoundIndex mudar sem trocar de nome. Em producao quem garante os indices e o
      # MongoIndexInitializer, explicito e idempotente.
      auto-index-creation: false

  graphql:
    graphiql:
      # console de consultas interativo e sem autenticacao: fica desligado por padrao e so e
      # ligado explicitamente no perfil dev
      enabled: ${GRAPHIQL_ENABLED:false}
    path: /graphql
    schema:
      locations: classpath:graphql/**/

nexio:
  engine:
    # teto de tempo total de uma execucao, verificado antes de cada no. Os tempos limite do cliente
    # HTTP sao por no e nao limitam a execucao em conjunto: um grafo de 50 nos somaria centenas de
    # segundos dentro de um request sincrono. Precisa ser positivo e nao passa de 5m -- a ligacao
    # das propriedades recusa o resto.
    max-execution-duration: ${NEXIO_ENGINE_MAX_EXECUTION_DURATION:30s}
  http:
    # requisicoes de saida dos nos de workflow so podem usar https; http em texto claro fica
    # restrito a dev/teste, onde o alvo e um servico local
    allow-insecure-http: ${NEXIO_HTTP_ALLOW_INSECURE:false}
  mongodb:
    # garante os indices declarados nas entidades depois que a aplicacao sobe
    ensure-indexes: ${NEXIO_MONGODB_ENSURE_INDEXES:true}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

---
spring:
  config:
    activate:
      on-profile: dev
  data:
    mongodb:
      # em dev o banco e local e vazio: o custo da criacao na subida e zero e evita um passo manual
      auto-index-creation: true
  graphql:
    graphiql:
      enabled: ${GRAPHIQL_ENABLED:true}

nexio:
  http:
    allow-insecure-http: true

---
spring:
  config:
    activate:
      on-profile: test
  data:
    mongodb:
      # sobrescrito pelo Testcontainers via @ServiceConnection
      uri: mongodb://localhost:27017/nexio_workflow_test
      # os testes de integracao afirmam quais indices existem: aqui a criacao na subida e o
      # caminho mais curto, e o container nasce vazio a cada execucao
      auto-index-creation: true

nexio:
  http:
    allow-insecure-http: true
